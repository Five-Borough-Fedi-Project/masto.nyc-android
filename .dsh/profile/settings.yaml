# Provider config. envsubst runs over this before it is copied into $DSH_HOME, so the vendor is a
# repo-variable change rather than a code change.
#
# Defaults route through Hugging Face's Inference Providers router, which is OpenAI-compatible and
# bills at the partner's rate with no HF markup. Point LLM_BASE_URL at https://api.deepseek.com to
# go direct to DeepSeek instead; nothing else has to change.
llm-pi-ai:
  providers:
    sync-provider:
      apiKeyEnv: LLM_API_KEY
      api: openai-completions
      baseURL: ${LLM_BASE_URL}
      models:
        - id: ${LLM_MODEL}
          contextWindow: 1000000
