# Patch layer for the upstream-sync profile.
#
# Provider and model live in settings.yaml, which is where dsh actually reads them from. An earlier
# version of this file carried a `model:` block; that key was a guess and dsh ignored it, which
# would have meant silently running on the default model.
#
# There is still no documented turn budget. The workflow bounds spend with timeout-minutes instead,
# which limits wall clock rather than turns.

sandbox:
  # The agent needs a real shell for git, gradle and gh. Containment comes from the runner being
  # disposable and the token being unable to push to main, not from this setting.
  mode: workspace

tools:
  deny:
    - "git push --force"
    - "git push origin main"
    - "gh pr merge"
    - "gh release"
