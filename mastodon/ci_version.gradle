// Included into build.gradle when building a release in CI. See FORK.md.
//
// Deliberately a separate file: build.gradle's versionCode/versionName are lines upstream bumps
// on every one of their releases, so editing them here would hand us a merge conflict every single
// time we pull upstream. Overriding from outside keeps build.gradle byte-identical to upstream
// forever, and leaves its versionName as an accurate record of which upstream release we're on.

// Applied unconditionally from fork.gradle so that a local build and a CI build behave the same.
// Without RELEASE_TAG or BUILD_NUMBER we leave upstream's versionCode and versionName alone,
// which is what an ordinary debug build wants. Two ways to build the same artifact is how a
// release bundle ends up stamped 2.13.2.
//
// BUILD_NUMBER is the number of commits on main, and it is the versionCode for everything we
// publish. Every merge produces a higher one, and the same commit always produces the same one,
// which is what lets main deploy itself to the internal track without a human choosing numbers.
// A versionCode can only ever be used once, so it has to come from something that only goes up.
//
// RELEASE_TAG still sets the versionName, because GithubSelfUpdaterImpl compares versionNames
// and wants vX.Y.Z. Without a tag the name is VERSION_NAME, which main's deploy sets to the last
// tag. Two builds can share a versionName; only the code has to be unique, and settings shows
// both.
def tag = System.getenv("RELEASE_TAG")
def buildNumber = System.getenv("BUILD_NUMBER")
if (!tag && !buildNumber) {
	logger.lifecycle("ci_version: neither RELEASE_TAG nor BUILD_NUMBER set, keeping upstream's " +
			"version. Set them when building anything you intend to publish.")
	return
}

// No tag: a build of main. The name comes from VERSION_NAME and the code from BUILD_NUMBER.
if (!tag) {
	def name = System.getenv("VERSION_NAME")
	if (!name) {
		throw new GradleException("BUILD_NUMBER is set without RELEASE_TAG, so this is a build of " +
				"main, but VERSION_NAME is not set and there is nothing to call it.")
	}
	def mainCode = buildNumber as int
	def upstreamName = android.defaultConfig.versionName
	android {
		defaultConfig {
			versionName name
			versionCode mainCode
		}
	}
	println "ci_version: main build -> versionName ${name}, versionCode ${mainCode} " +
			"(upstream base ${upstreamName})"
	return
}

// Must be exactly vX.Y.Z. GithubSelfUpdaterImpl matches /v?(\d+)\.(\d+)(?:\.(\d+))?/ and ignores
// anything after the third number, so "v1.0.0-beta" and "v1.0.0" compare EQUAL and the in-app
// update is never offered. Suffixes are not a cosmetic choice here; they break updates.
if (!(tag ==~ /^v\d+\.\d+\.\d+$/)) {
	throw new GradleException("RELEASE_TAG '${tag}' must be exactly vX.Y.Z (no suffixes, no 'v1.2').")
}

def m = (tag =~ /^v(\d+)\.(\d+)\.(\d+)$/)
def major = m[0][1] as int
def minor = m[0][2] as int
def patch = m[0][3] as int

// versionCode must strictly increase and never repeat. 1000 per position gives room for 999
// minor/patch releases; beyond that the arithmetic would collide (e.g. 1.0.1000 == 1.1.0).
if (minor > 999 || patch > 999) {
	throw new GradleException("RELEASE_TAG '${tag}': minor and patch must each be <= 999.")
}
// BUILD_NUMBER wins when both are set, so a tagged build and main's own build of the same commit
// agree on the code. Without that the two channels would hand the same install different numbers
// and one of them could not be installed over the other.
def code = buildNumber ? (buildNumber as int) : (major * 1000000 + minor * 1000 + patch)
if (code > 2100000000) {
	throw new GradleException("RELEASE_TAG '${tag}' produces versionCode ${code}, over Google Play's limit.")
}

// Capture upstream's value before overwriting it - that's the record of which upstream release
// this fork is built on, and it is maintained for free by every upstream merge.
def upstreamVersion = android.defaultConfig.versionName

android {
	defaultConfig {
		versionName "${major}.${minor}.${patch}"
		versionCode code
	}
}

println "ci_version: ${tag} -> versionName ${major}.${minor}.${patch}, versionCode ${code} " +
		"(${buildNumber ? 'from BUILD_NUMBER' : 'from the tag'}, upstream base ${upstreamVersion})"
