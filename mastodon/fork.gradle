// Everything this fork changes about the build, kept out of build.gradle's busiest region.
//
// build.gradle now carries exactly one line of ours, an `apply from:` at the very bottom. That
// matters because upstream bumps versionCode and versionName in defaultConfig on every single
// release, and git's default three lines of context mean anything we add near them conflicts every
// time. Measured before this change: merging v2.13.2 onto v2.13.1 plus our delta conflicted on
// `compileSdkMinor 0` purely because it sits four lines above the version bump. At 23 upstream
// releases a year that is 23 guaranteed conflicts, each one waking the agent.
//
// The bottom of the dependencies block is dead space by comparison. Upstream appends dependencies
// there occasionally, but not on a per-release cadence.

android {
	// Google no longer publishes a bare platforms;android-37. Every API 37 platform is
	// minor-versioned, so compileSdk 37 alone fails to resolve. See FORK.md.
	compileSdkMinor 0

	defaultConfig {
		// Distinct from upstream's org.joinmastodon.android so both can be installed at once, and
		// so we can publish independently. Carries the OAuth callback scheme and the FileProvider
		// authority with it, since both are templated from ${applicationId}.
		applicationId "nyc.masto.android"
	}
}

// Build against the patched appkit in third_party/appkit instead of the published artifact. The
// version in build.gradle stays upstream's, so dropping this block is all it takes to go back once
// appkit publishes the fix. See third_party/appkit/README.md.
configurations.configureEach {
	resolutionStrategy.dependencySubstitution {
		substitute module('me.grishka.appkit:appkit') using project(':appkit')
	}
}

// Guard against the vendored appkit going stale. Substitution ignores the version build.gradle
// asks for, so an upstream bump to a newer appkit would silently keep building the source in
// third_party/appkit. Fail instead, and say what to do about it.
afterEvaluate {
	def vendored = new Properties()
	def versionFile = rootProject.file('third_party/appkit/vendored-version.txt')
	versionFile.withInputStream { vendored.load(it) }
	def declared = configurations.implementation.allDependencies.find {
		it.group == 'me.grishka.appkit' && it.name == 'appkit'
	}?.version
	if (declared == null) {
		throw new GradleException("third_party/appkit is still substituted in, but build.gradle no " +
				"longer depends on me.grishka.appkit:appkit. If upstream dropped appkit, drop the " +
				"vendored copy too, per third_party/appkit/README.md.")
	}
	if (declared != vendored.version) {
		throw new GradleException("build.gradle wants appkit ${declared}, but third_party/appkit is " +
				"vendored from ${vendored.version}. Either re-vendor onto ${declared} with the patch " +
				"in third_party/appkit/patches/, or, if ${declared} already has the fix, delete the " +
				"vendored copy. third_party/appkit/README.md has both paths.")
	}
}

// Version derivation, active only when RELEASE_TAG is set. Applied here rather than appended by
// each workflow so local and CI builds cannot drift apart.
apply from: 'ci_version.gradle'
