// A patched copy of me.grishka.appkit:appkit, substituted for the Maven artifact in
// mastodon/fork.gradle. See README.md in this directory for what's patched and when to drop it.
//
// This file is ours, not appkit's. Upstream's build.gradle targets an older AGP and applies its
// Maven Central publishing script, neither of which belongs in this build. Dependencies match the
// published 1.5.3 POM.

plugins {
	id 'com.android.library'
}

android {
	namespace 'me.grishka.appkit'
	compileSdk 37
	defaultConfig {
		minSdk 21
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	lint {
		abortOnError false
	}
}

dependencies {
	api 'androidx.annotation:annotation:1.3.0'
	api 'com.squareup.okhttp3:okhttp:3.14.9'
	implementation 'me.grishka.litex:recyclerview:1.2.1.1'
	implementation 'me.grishka.litex:swiperefreshlayout:1.1.0.1'
	implementation 'me.grishka.litex:viewpager:1.0.0'
	implementation 'me.grishka.litex:collection:1.1.0'
}
