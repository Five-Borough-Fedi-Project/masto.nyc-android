name: Build and deploy production

# Publishes to Google Play on a published GitHub release, alongside release-apk.yml which attaches
# the APK to the release itself.
#
# The first upload for a new app cannot come from here. Google's Play Developer API refuses to
# operate on an app that has never had a build uploaded through the Console, and fastlane surfaces
# that as a confusing "app not found". Do one manual upload first; see SETUP.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
      dry_run:
        description: "Validate against Play without publishing anything"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Same rule as release-apk.yml. versionCode derives from this, and Play rejects a
      # duplicate or lower versionCode permanently, so a malformed tag has to fail here rather
      # than halfway through an upload.
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must be exactly vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 platform-tools"

      - name: Decode keystore
        uses: timheuer/base64-to-file@v1
        id: android_keystore
        with:
          fileName: "release.jks"
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Prepare Gradle environment
        run: |
          echo "apply from: 'ci_signing.gradle'" >> mastodon/build.gradle
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Remove translations from fastlane metadata
        run: |
          mv fastlane/metadata/android fastlane/metadata/android_orig
          mkdir fastlane/metadata/android
          mv fastlane/metadata/android_orig/en-US fastlane/metadata/android/

      # fastlane's failure for a malformed key is one line buried under the Android SDK licence
      # text, and it never says what is actually wrong with it. Check it here instead, reporting
      # structure only so nothing sensitive reaches the log.
      - name: Validate the service account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY is empty or unset."
            exit 1
          fi
          printf '%s' "$KEY" > /tmp/sa.json
          echo "length: $(wc -c < /tmp/sa.json) bytes"
          echo "starts with: $(head -c 1 /tmp/sa.json)"
          if ! python3 -c "import json;json.load(open('/tmp/sa.json'))" 2>/dev/null; then
            echo "::error::The secret is not valid JSON."
            echo "::error::It must be the entire .json file Google Cloud downloaded, pasted verbatim,"
            echo "::error::starting with { and ending with }. Not base64, not quoted, not a file path."
            exit 1
          fi
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/sa.json'))
          need = ["type", "project_id", "private_key", "client_email"]
          missing = [k for k in need if not d.get(k)]
          if missing:
              print(f"::error::Valid JSON but missing required fields: {', '.join(missing)}")
              raise SystemExit(1)
          print(f"type={d['type']}  project={d['project_id']}  client_email={d['client_email']}")
          if d["type"] != "service_account":
              print("::error::type is not service_account. This looks like an OAuth client, not a service account key.")
              raise SystemExit(1)
          EOF
          rm -f /tmp/sa.json

      # Play falls back to default.txt when a versionCode has no changelog of its own, which still
      # says "released the first version!". Fail instead of shipping that.
      - name: Assert the changelog for this versionCode exists
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJOR MINOR PATCH <<< "${TAG#v}"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          FILE="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ ! -s "$FILE" ]; then
            echo "::error::$FILE is missing or empty, so Play would show default.txt instead."
            exit 1
          fi
          echo "Release notes for versionCode $CODE:"
          cat "$FILE"

      # Nothing here has run a test. CI covers pull requests, but a release builds a tag, and
      # shipping a tag that never passed anything is how the last two releases went wrong.
      # ci_signing.gradle is applied to build.gradle above, and it reads the keystore at
      # configuration time, so every Gradle invocation in this job needs these. Without them the
      # build fails with "Cannot convert 'null' to File" before running anything.
      - name: Run checks
        run: ./gradlew testDebugUnitTest lintDebug --console=plain
        env:
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

      # Everything is built before anything is uploaded. The Play upload used to run first, so a
      # later failure left Play updated and the GitHub release without its APK, which is exactly
      # what v0.1.2 did.
      - name: Build bundle and APKs
        run: ./gradlew bundleRelease assembleRelease assembleGithubRelease --console=plain
        env:
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

      # Always validate first. Play checks the bundle, the track and the notes and publishes
      # nothing, so a rejection costs a failed job rather than a burnt versionCode.
      - name: Validate the upload against Google Play
        run: bundle exec fastlane deploy
        env:
          PLAY_VALIDATE_ONLY: true
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPPLY_SKIP_UPLOAD_METADATA: true

      - name: Build and deploy to Google Play
        if: ${{ !inputs.dry_run }}
        run: bundle exec fastlane deploy
        env:
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPPLY_SKIP_UPLOAD_METADATA: true

      # fastlane reported success for a promotion that changed nothing, so don't trust the exit
      # code: read the tracks back and check the release is on the track with the status asked for.
      - name: Confirm the release on Play
        if: ${{ !inputs.dry_run }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          WANT: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth
          IFS=. read -r MAJOR MINOR PATCH <<< "${TAG#v}"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          python3 tools/play-status.py --expect "internal:$CODE:completed" --expect "$TRACK:$CODE:$WANT"

      - name: Upload release apk
        uses: actions/upload-artifact@v4
        with:
          name: mastodon-release.apk
          path: mastodon/build/outputs/apk/release/mastodon-release.apk

      - name: Upload githubRelease apk
        uses: actions/upload-artifact@v4
        with:
          name: mastodon-githubRelease.apk
          path: mastodon/build/outputs/apk/githubRelease/mastodon-githubRelease.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: mastodon/build/outputs/mapping/*/mapping.txt