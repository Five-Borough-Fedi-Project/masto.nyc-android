name: CI

# Re-derives, from scratch, whatever a PR claims. When the sync agent says "I fixed it and the
# build passes", this is the thing that decides whether that was true. It never reads the agent's
# output and has no access to the DeepSeek key.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Assemble
        run: ./gradlew assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      # Cheap checks for the specific ways an upstream merge can quietly undo our fork.
      - name: Assert the branding delta survived
        run: |
          set -euo pipefail
          fail=0
          check() {
            if ! grep -q "$2" "$1"; then
              echo "::error file=$1::expected to find '$2' - the upstream merge may have reverted our delta"
              fail=1
            fi
          }
          # applicationId and compileSdkMinor live in fork.gradle, not build.gradle. build.gradle
          # carries only the apply line, which is the piece an upstream merge could drop.
          check mastodon/build.gradle "apply from: 'fork.gradle'"
          check mastodon/fork.gradle 'applicationId "nyc.masto.android"'
          check mastodon/fork.gradle 'compileSdkMinor'
          check mastodon/src/main/res/values/strings.xml '>Masto NYC<'
          check mastodon/src/main/java/org/joinmastodon/android/fork/ForkConfig.java 'masto.nyc'
          check mastodon/src/main/java/org/joinmastodon/android/api/MastodonAPIController.java 'ForkConfig.USER_AGENT_PRODUCT'
          check mastodon/src/main/java/org/joinmastodon/android/MastodonApp.java 'ForkConfig.USER_AGENT_PRODUCT'
          if grep -rn 'mastodon.social' mastodon/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml points at mastodon.social again"
            fail=1
          fi
          exit $fail

      - name: Assert the built APK is actually ours
        run: |
          set -euo pipefail
          APK=mastodon/build/outputs/apk/debug/mastodon-debug.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -2
          echo "$BADGING" | grep -q "package: name='nyc.masto.android'" \
            || { echo "::error::APK package name is not nyc.masto.android"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Masto NYC'" \
            || { echo "::error::APK label is not Masto NYC"; exit 1; }
