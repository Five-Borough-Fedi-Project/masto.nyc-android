name: CI

# Re-derives, from scratch, whatever a PR claims. When the sync agent says "I fixed it and the
# build passes", this is the thing that decides whether that was true. It never reads the agent's
# output and has no access to the DeepSeek key.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 platform-tools build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Assemble
        run: ./gradlew assembleDebug --console=plain

      # Every build type has to resolve against the vendored appkit, not just debug: it is a project
      # dependency, so Gradle matches build types, and the release workflow builds githubRelease.
      - name: Assemble the other build types
        run: ./gradlew assembleGithubRelease assembleBeta assembleAndroidTest --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      # Cheap checks for the specific ways an upstream merge can quietly undo our fork.
      - name: Assert the branding delta survived
        run: |
          set -euo pipefail
          fail=0
          check() {
            if ! grep -q "$2" "$1"; then
              echo "::error file=$1::expected to find '$2' - the upstream merge may have reverted our delta"
              fail=1
            fi
          }
          # applicationId and compileSdkMinor live in fork.gradle, not build.gradle. build.gradle
          # carries only the apply line, which is the piece an upstream merge could drop.
          check mastodon/build.gradle "apply from: 'fork.gradle'"
          check mastodon/fork.gradle 'applicationId "nyc.masto.android"'
          check mastodon/fork.gradle 'compileSdkMinor'
          check mastodon/src/main/res/values/strings.xml '>Masto NYC<'
          check mastodon/src/main/java/org/joinmastodon/android/fork/ForkConfig.java 'masto.nyc'
          check mastodon/src/main/java/org/joinmastodon/android/api/MastodonAPIController.java 'ForkConfig.USER_AGENT_PRODUCT'
          check mastodon/src/main/java/org/joinmastodon/android/MastodonApp.java 'ForkConfig.USER_AGENT_PRODUCT'
          if grep -rn 'mastodon.social' mastodon/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml points at mastodon.social again"
            fail=1
          fi
          exit $fail

      - name: Assert no build outputs are committed
        run: |
          set -euo pipefail
          # These were committed once, and the release failed because fastlane found the vendored
          # library's androidTest APK sitting next to the app bundle.
          if git ls-files | grep -E '/build/' ; then
            echo "::error::build outputs are tracked in git - see third_party/appkit/.gitignore"
            exit 1
          fi

      - name: Assert no deprecated system bar color calls came back
        run: |
          set -euo pipefail
          # The source greps below only cover this repo. This one covers the built APK, so a call
          # arriving from any dependency counts too - including a re-vendored appkit that lost the
          # patch, which no grep here would see.
          apk=mastodon/build/outputs/apk/debug/mastodon-debug.apk
          dexdump=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/dexdump | head -1)
          calls=0
          for d in $(unzip -Z1 "$apk" 'classes*.dex'); do
            unzip -p "$apk" "$d" > /tmp/one.dex
            n=$("$dexdump" -d /tmp/one.dex | grep -cE 'invoke-.*(Landroid/view/Window|FragmentRootLinearLayout);\.set(Status|Navigation)BarColor' || true)
            calls=$((calls+n))
          done
          echo "deprecated system bar color call sites in the APK: $calls"
          if [ "$calls" != "0" ]; then
            echo "::error::the built APK calls deprecated system bar color APIs - see FORK.md#patched-appkit"
            exit 1
          fi
          # Window.setStatusBarColor and setNavigationBarColor do nothing from API 35 and Play
          # Console flags them. An upstream merge can add a call back without breaking the build,
          # unlike the renamed FragmentRootLinearLayout methods, which stop compiling.
          if grep -rnE '\.set(Status|Navigation)BarColor\(' mastodon/src third_party/appkit/src; then
            echo "::error::a deprecated Window system bar color call is back - see FORK.md#patched-appkit"
            exit 1
          fi
          # ObjectAnimator resolves property names by reflection, so an animator using the old
          # FragmentRootLinearLayout property names compiles and then throws at runtime.
          if grep -rnE '"(status|navigation)BarColor"' mastodon/src third_party/appkit/src; then
            echo "::error::an ObjectAnimator is using an old system bar color property name"
            exit 1
          fi

      - name: Assert the built APK is actually ours
        run: |
          set -euo pipefail
          APK=mastodon/build/outputs/apk/debug/mastodon-debug.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -2
          echo "$BADGING" | grep -q "package: name='nyc.masto.android'" \
            || { echo "::error::APK package name is not nyc.masto.android"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Masto NYC'" \
            || { echo "::error::APK label is not Masto NYC"; exit 1; }
