name: Promote a Play release

# Takes a build already uploaded to Play and changes its release status, typically draft to
# completed. A versionCode can only be uploaded once, so a draft that should go live has to be
# promoted; re-running the release workflow would fail on the duplicate.
#
# Normal releases don't need this: PLAY_RELEASE_STATUS decides how they land. This is for builds
# uploaded before that was set, and for promoting a staged rollout by hand.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode to promote, e.g. 1004"
        required: true
      status:
        description: "Release status to promote to"
        type: choice
        options: [completed, inProgress, halted, draft]
        default: completed
      dry_run:
        description: "Validate against Play without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the versionCode
        env:
          CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode '$CODE' is not a number"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      # Same check as the deploy workflow: fastlane's error for a malformed key is unreadable.
      - name: Validate the service account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY is empty or unset."
            exit 1
          fi
          printf '%s' "$KEY" > /tmp/sa.json
          python3 -c "import json;json.load(open('/tmp/sa.json'))" || {
            echo "::error::The secret is not valid JSON."
            exit 1
          }
          rm -f /tmp/sa.json

      - name: Validate the promotion against Google Play
        run: bundle exec fastlane promote
        env:
          PLAY_VALIDATE_ONLY: true
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Promote on Google Play
        if: ${{ !inputs.dry_run }}
        run: bundle exec fastlane promote
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      # fastlane reported success for a promotion that did nothing, so read the tracks back and
      # fail if the release is not in the status that was asked for.
      - name: Confirm the status on Play
        if: ${{ !inputs.dry_run }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CODE: ${{ inputs.version_code }}
          WANT: ${{ inputs.status }}
          TRACK: ${{ vars.PLAY_TRACK || 'production' }}
        run: |
          pip install --quiet google-auth
          python3 tools/play-status.py | tee /tmp/status.txt
          if ! grep -qE "versionCode .*\b$CODE\b.*status=$WANT" /tmp/status.txt; then
            echo "::error::versionCode $CODE is not $WANT on $TRACK - see the track listing above"
            exit 1
          fi
          echo "versionCode $CODE is $WANT on $TRACK"
