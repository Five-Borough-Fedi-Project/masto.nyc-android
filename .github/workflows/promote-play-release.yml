name: Promote a Play release

# Takes a build already uploaded to Play and changes its release status, typically draft to
# completed. A versionCode can only be uploaded once, so a draft that should go live has to be
# promoted; re-running the release workflow would fail on the duplicate.
#
# Normal releases don't need this: PLAY_RELEASE_STATUS decides how they land. This is for builds
# uploaded before that was set, and for promoting a staged rollout by hand.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode to promote, e.g. 1004"
        required: true
      from_track:
        description: "Track the build is on now"
        default: production
      to_track:
        description: "Track to promote it to"
        default: production
      status:
        description: "Release status to promote to"
        type: choice
        options: [completed, inProgress, halted, draft]
        default: completed
      update_notes:
        description: "Replace the release notes"
        type: boolean
        default: false
      notes:
        description: "Release notes to publish. Leave empty to use changelogs/<versionCode>.txt."
        required: false
      dry_run:
        description: "Validate against Play without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the versionCode
        env:
          CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode '$CODE' is not a number"
            exit 1
          fi

      - uses: actions/checkout@v4

      # supply walks every language it finds, and the rest are Crowdin translations of upstream's
      # listing. Same trimming the deploy workflow does.
      - name: Remove translations from fastlane metadata
        if: ${{ inputs.update_notes }}
        run: |
          mv fastlane/metadata/android fastlane/metadata/android_orig
          mkdir fastlane/metadata/android
          mv fastlane/metadata/android_orig/en-US fastlane/metadata/android/

      # Notes can be given here rather than committed, and that is usually what you want. Every
      # merge to main uploads a new build, and the internal track holds one release at a time, so
      # committing notes for the build you meant to promote replaces that build with a new one.
      # Chasing it with another commit does the same thing again.
      - name: Work out the notes
        if: ${{ inputs.update_notes }}
        env:
          CODE: ${{ inputs.version_code }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          FILE="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ -n "${NOTES:-}" ]; then
            mkdir -p "$(dirname "$FILE")"
            printf '%s\n' "$NOTES" > "$FILE"
            echo "Using the notes given to this run."
          elif [ ! -s "$FILE" ]; then
            echo "::error::No notes were given and $FILE is missing, so there is nothing to"
            echo "::error::replace the release notes with."
            exit 1
          else
            echo "Using the committed $FILE."
          fi
          if [ "$(wc -c < "$FILE")" -gt 500 ]; then
            echo "::error::The notes are $(wc -c < "$FILE") characters; Play's limit is 500."
            exit 1
          fi
          echo "Release notes that will be published for $CODE:"
          cat "$FILE"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      # Same check as the deploy workflow: fastlane's error for a malformed key is unreadable.
      - name: Validate the service account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY is empty or unset."
            exit 1
          fi
          printf '%s' "$KEY" > /tmp/sa.json
          python3 -c "import json;json.load(open('/tmp/sa.json'))" || {
            echo "::error::The secret is not valid JSON."
            exit 1
          }
          rm -f /tmp/sa.json

      - name: Validate the promotion against Google Play
        run: bundle exec fastlane promote
        env:
          PLAY_VALIDATE_ONLY: true
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_TRACK: ${{ inputs.from_track }}
          PLAY_PROMOTE_TO: ${{ inputs.to_track }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
          PLAY_UPLOAD_NOTES: ${{ inputs.update_notes }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Promote on Google Play
        if: ${{ !inputs.dry_run }}
        run: bundle exec fastlane promote
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_TRACK: ${{ inputs.from_track }}
          PLAY_PROMOTE_TO: ${{ inputs.to_track }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
          PLAY_UPLOAD_NOTES: ${{ inputs.update_notes }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      # fastlane reported success for a promotion that did nothing, so read the tracks back and
      # fail if the release is not in the status that was asked for.
      - name: Confirm the status on Play
        if: ${{ !inputs.dry_run }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CODE: ${{ inputs.version_code }}
          WANT: ${{ inputs.status }}
          TRACK: ${{ inputs.to_track }}
        run: |
          pip install --quiet google-auth
          python3 tools/play-status.py --expect "$TRACK:$CODE:$WANT"
